<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raymiyo Field</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f3f5fb; color: #111b2e; }
      .card { margin: 24px; padding: 28px; border-radius: 22px; background: #fff; text-align: center; box-shadow: 0 10px 30px rgba(17, 27, 46, 0.08); }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #5b6577; }
      button { border: 0; border-radius: 14px; padding: 14px 22px; font-size: 16px; font-weight: 700; color: #fff; background: #ff6a3d; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>No internet</h1>
      <p>Raymiyo Field needs mobile data or Wi-Fi. Check your connection and try again.</p>
      <button onclick="location.href = 'https://field.raymiyo.com/'">Try again</button>
    </div>
  </body>
</html>
