<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raymiyo TV Board</title>
<style>
  html,body{margin:0;height:100%;background:#0b1120;color:#e6edf7;
    font-family:system-ui,sans-serif;overflow:hidden}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:20px;padding:3vh 2vw;box-sizing:border-box}
  .brand{font-size:15px;font-weight:600;letter-spacing:4px;opacity:.45;margin:0}
  .title{font-size:clamp(20px,3vw,34px);font-weight:700;letter-spacing:1px;
    margin:0;text-align:center;min-height:1.2em;transition:opacity .5s}
  .stage{width:100%;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
  .fade{opacity:0}
  .tile{background:#fff;border-radius:18px;padding:12px;box-shadow:0 26px 80px rgba(0,0,0,.55)}
  .tile img{display:block;max-width:86vw;max-height:64vh;width:auto;height:auto;border-radius:12px}
  .board{width:92vw;max-width:1500px}
  .team{display:flex;align-items:baseline;justify-content:center;gap:14px;margin-bottom:18px}
  .team .lbl{font-size:16px;letter-spacing:2px;opacity:.5;text-transform:uppercase}
  .team .val{font-size:44px;font-weight:800;color:#5b8cff}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .card{background:#111c33;border:1px solid #1e2c4a;border-radius:14px;padding:14px;min-height:22vh}
  .card h3{margin:0 0 4px;font-size:18px}
  .card .pct{font-size:13px;opacity:.6;margin-bottom:10px}
  .card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .card li{font-size:14px;line-height:1.35}
  .bar{height:6px;border-radius:3px;background:#1e2c4a;margin-top:4px;overflow:hidden}
  .bar>span{display:block;height:100%;background:#34d399;border-radius:3px}
  .empty{opacity:.4;font-size:15px}
  .dots{display:flex;gap:10px;margin-top:6px;min-height:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:#2a3550;transition:background .3s}
  .dot.on{background:#5b8cff}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
  <div class="wrap">
    <p class="brand">RAYMIYO — SALES &amp; COLLECTIONS</p>
    <h1 class="title" id="title"></h1>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
  </div>

<script>
(function(){
  // Used only if the playlist can't be loaded and nothing is cached yet.
  const DEFAULT_TILES = [
    { id:"b2c-sales", type:"chart", title:"B2C Sales — This Month", secs:20, on:true,
      url:"https://crm.zoho.com/crm/specific/ViewChartImage?width=1000&height=500&embedDetails=4f21a008487b89ec72fb7af7053b2b7b947b93e3449bf5626c9b865485db39dce00d3d620382d40c4c3314d75b1d39f1dcae43f9913c2013d943372fccc7e525483c12e804950590b71be62c8884c96d65d30c59cafaf16013a02d28ca70130219129f2f9936d53ebf77ffe87e37652d" },
    { id:"new-b2c-vs-target", type:"chart", title:"New B2C Customers vs Target", secs:20, on:true,
      url:"https://crm.zoho.com/crm/specific/ViewChartImage?width=1000&height=500&embedDetails=121253a543b831b67c1ec55db952fec577b7afae95adc3f4a231444b36830a78ae4c8a5205c58cbc5746a8d4c1aa21e81660843d77f3663f4295fe20febfe3d333bf8ef53edd181a68d033be3417c7534c2a9030dcab160f2c6992b82d2f575b6f663ad18fbffd27842743c7de3e4d9d" },
    { id:"huddle-tasks", type:"tasks", title:"This Week's Huddle", secs:30, on:true }
  ];

  const stage = document.getElementById("stage");
  const titleEl = document.getElementById("title");
  const dotsEl = document.getElementById("dots");
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function h(tag, cls, text){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text !== undefined) e.textContent = text;
    return e;
  }

  async function fetchTiles(){
    try{
      const r = await fetch("/api/tiles", { cache:"no-store" });
      if(!r.ok) throw new Error("bad status");
      const d = await r.json();
      if(Array.isArray(d.tiles)){
        try{ localStorage.setItem("tvTiles", JSON.stringify(d.tiles)); }catch(e){}
        return d.tiles;
      }
    }catch(e){}
    try{
      const c = JSON.parse(localStorage.getItem("tvTiles") || "null");
      if(Array.isArray(c)) return c;
    }catch(e){}
    return DEFAULT_TILES;
  }

  async function fetchTasks(){
    try{
      const r = await fetch("/api/tasks", { cache:"no-store" });
      if(!r.ok) return null;
      const d = await r.json();
      return d && Array.isArray(d.members) ? d : null;
    }catch(e){ return null; }
  }

  function renderChart(tile){
    stage.textContent = "";
    const wrap = h("div", "tile");
    const img = new Image();
    img.alt = "";
    const sep = tile.url.indexOf("?") === -1 ? "?" : "&";
    img.src = tile.url + sep + "_t=" + Date.now();   // fresh numbers every showing
    wrap.appendChild(img);
    stage.appendChild(wrap);
  }

  function renderTasks(d){
    stage.textContent = "";
    const board = h("div", "board");
    const team = h("div", "team");
    team.appendChild(h("span", "lbl", "Team Score"));
    team.appendChild(h("span", "val", d.teamScore + "%"));
    board.appendChild(team);
    const grid = h("div", "grid");
    d.members.forEach(m => {
      const card = h("div", "card");
      card.appendChild(h("h3", "", m.name));
      card.appendChild(h("div", "pct", m.avg + "% done"));
      const ul = h("ul");
      if(m.tasks.length){
        m.tasks.forEach(t => {
          const li = h("li", "", t.text);
          const bar = h("div", "bar");
          const fill = document.createElement("span");
          fill.style.width = Math.max(0, Math.min(100, t.pct)) + "%";
          bar.appendChild(fill);
          li.appendChild(bar);
          ul.appendChild(li);
        });
      } else {
        ul.appendChild(h("li", "empty", "No tasks"));
      }
      card.appendChild(ul);
      grid.appendChild(card);
    });
    board.appendChild(grid);
    stage.appendChild(board);
  }

  function showMessage(text){
    titleEl.textContent = "";
    stage.textContent = "";
    stage.appendChild(h("div", "empty", text));
    dotsEl.textContent = "";
  }

  function buildDots(n){
    dotsEl.textContent = "";
    for(let i = 0; i < n; i++) dotsEl.appendChild(h("div", "dot"));
  }

  async function swapTo(render, title, index){
    stage.classList.add("fade"); titleEl.classList.add("fade");
    await sleep(500);
    titleEl.textContent = title || "";
    render();
    [...dotsEl.children].forEach((d, k) => d.classList.toggle("on", k === index));
    stage.classList.remove("fade"); titleEl.classList.remove("fade");
  }

  async function main(){
    while(true){
      const tiles = (await fetchTiles()).filter(t => t && t.on !== false);
      const wantsTasks = tiles.some(t => t.type === "tasks");
      const tasks = wantsTasks ? await fetchTasks() : null;
      const hasTasks = !!(tasks && tasks.members.some(m => m.tasks && m.tasks.length));
      // skip the task slide when nobody has tasks (or the feed is unreachable)
      const playlist = tiles.filter(t => t.type !== "tasks" || hasTasks);

      if(!playlist.length){
        showMessage("Nothing to show yet — add a tile in /admin");
        await sleep(30000);
        continue;
      }

      buildDots(playlist.length);
      for(let i = 0; i < playlist.length; i++){
        const t = playlist[i];
        if(t.type === "tasks") await swapTo(() => renderTasks(tasks), t.title, i);
        else await swapTo(() => renderChart(t), t.title, i);
        await sleep((Number(t.secs) || 20) * 1000);
      }
    }
  }

  main();
  setTimeout(() => location.reload(), 6 * 60 * 60 * 1000); // fresh start every 6 hours
})();
</script>
</body>
</html>
