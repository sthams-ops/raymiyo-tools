<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raymiyo TV Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F4F7FF; --ink2:#A9B6DB; --rim:rgba(255,255,255,.16); --track:rgba(255,255,255,.12);
    --sky:#4CC9F0; --violet:#7C8CFF; --mint:#2FD6A0; --amber:#FFC24B; --coral:#FF6B5E;
    --display:"Barlow Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;
    --body:"Barlow","Roboto","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:var(--body);
    background:
      radial-gradient(1000px 760px at 6% 4%, rgba(124,92,255,.46), transparent 62%),
      radial-gradient(1100px 820px at 98% 100%, rgba(24,180,244,.30), transparent 62%),
      radial-gradient(760px 600px at 80% 4%, rgba(232,80,143,.20), transparent 62%),
      linear-gradient(160deg,#0A1030 0%,#10184A 55%,#0B1238 100%);}
  #canvas{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;visibility:hidden}
  #canvas.ready{visibility:visible}
  #dbg{position:fixed;left:8px;top:8px;z-index:99;background:rgba(0,0,0,.78);color:#7CFFB2;font:14px/1.45 monospace;padding:8px 12px;border-radius:8px;white-space:pre}

  /* shared: frosted-glass surface and the rotating shine border (no blur filters, so it stays light on TV boxes) */
  .glass{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
    border:1px solid var(--rim);box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 22px 44px rgba(2,6,30,.45)}
  .shine{position:relative;overflow:hidden;background:rgba(255,255,255,.16)}
  .shine::before{content:"";position:absolute;left:50%;top:50%;width:var(--sq,1900px);height:var(--sq,1900px);
    margin:calc(var(--sq,1900px) / -2) 0 0 calc(var(--sq,1900px) / -2);
    background:conic-gradient(from 0deg,transparent 0,transparent 60%,rgba(124,140,255,.95) 78%,rgba(76,201,240,1) 90%,transparent 100%);
    animation:spin 9s linear infinite;will-change:transform}
  .shine::after{content:"";position:absolute;left:3px;right:3px;top:3px;bottom:3px;border-radius:inherit;background:var(--fill,#fff)}
  .shine>*{position:relative;z-index:1}
  @keyframes spin{to{transform:rotate(360deg)}}
  body.lite .shine::before{animation:none}

  /* ── top bar ── */
  .top{position:absolute;left:72px;right:72px;top:0;height:116px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:20px}
  .mark{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,#7C5CFF,#18B4F4);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:46px;line-height:1;
    box-shadow:0 10px 28px rgba(124,92,255,.5)}
  .brand-name{font-family:var(--display);font-weight:800;font-size:46px;line-height:1}
  .brand-sub{font-size:23px;font-weight:500;color:var(--ink2);margin-top:4px}
  .clock{text-align:right}
  .time{font-family:var(--display);font-weight:700;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
  .date{font-size:24px;font-weight:500;color:var(--ink2);margin-top:4px}

  /* ── stage ── */
  .stage{position:absolute;left:72px;right:72px;top:128px;bottom:112px;display:flex;flex-direction:column;transition:opacity .45s}
  .stage.fade{opacity:0}

  /* chart slide */
  .head{display:flex;align-items:flex-end;justify-content:space-between;height:104px;padding-bottom:6px}
  .slide-title{margin:0;font-family:var(--display);font-weight:800;font-size:80px;line-height:1;
    background:linear-gradient(90deg,#FFFFFF,#BFC9FF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .slide-meta{font-size:24px;font-weight:500;color:var(--ink2);padding-bottom:10px}
  .chart-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding-bottom:8px}
  .panel{--sq:1700px;--fill:#fff;border-radius:30px;padding:23px;box-shadow:0 26px 60px rgba(2,6,30,.55)}
  .panel img{display:block;height:640px;width:auto;max-width:1640px;border-radius:10px}
  .broken{width:1100px;height:640px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#53627E}

  /* task slide: scoreboard */
  .board{--sq:2000px;--fill:linear-gradient(145deg,#161F63,#0A113C);height:236px;color:#fff;border-radius:26px;
    display:flex;align-items:center;padding:0 56px;gap:64px;box-shadow:0 26px 60px rgba(2,6,30,.55)}
  .sb-score{width:430px}
  .sb-label{font-size:28px;font-weight:600;color:#B7C3EA}
  .sb-num{font-family:var(--display);font-weight:800;font-size:178px;line-height:.86;font-variant-numeric:tabular-nums;margin-top:6px;
    background:linear-gradient(180deg,#FFFFFF 30%,#B9C4FF 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .sb-mid{flex:1}
  .segs{display:flex;gap:7px}
  .seg{flex:1;height:70px;border-radius:8px;background:rgba(255,255,255,.10)}
  .seg.lit{background:var(--c);box-shadow:0 0 22px var(--c)}
  .sb-status{margin-top:18px;font-family:var(--display);font-weight:700;font-size:42px;line-height:1}
  .sb-right{width:430px;text-align:right}
  .sb-title{font-family:var(--display);font-weight:800;font-size:50px;line-height:1}
  .sb-week{font-family:var(--display);font-weight:700;font-size:40px;color:#B7C3EA;margin-top:10px;line-height:1}
  .sb-count{font-size:28px;font-weight:500;color:#B7C3EA;margin-top:14px}

  /* task slide: one glass card per person */
  .sheet{--tsize:30px;--tlines:3;margin-top:26px;flex:1;display:flex;gap:22px;min-height:0}
  .member{flex:1 1 0;min-width:0;min-height:0;position:relative;padding:36px 26px 22px;border-radius:26px;overflow:hidden;
    background:
      radial-gradient(130% 55% at 50% 0%, var(--whoa,rgba(124,140,255,.30)), transparent 70%),
      linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
    border:1px solid var(--rim);box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 22px 44px rgba(2,6,30,.40)}
  .member .bar-top{position:absolute;left:26px;right:26px;top:0;height:6px;border-radius:0 0 6px 6px;background:var(--who);box-shadow:0 0 22px var(--who)}
  .mhead{display:flex;align-items:center;gap:18px}
  .ring{position:relative;width:112px;height:112px;flex:none}
  .ring svg{width:112px;height:112px;transform:rotate(-90deg)}
  .ring .trk{fill:none;stroke:rgba(255,255,255,.14);stroke-width:12}
  .ring .arc{fill:none;stroke:var(--c);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1.1s ease-out}
  .ring .pc{position:absolute;left:0;top:0;width:112px;height:112px;display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:800;font-size:38px}
  .mname{font-family:var(--display);font-weight:800;font-size:46px;line-height:1}
  .mrole{font-size:24px;font-weight:500;color:var(--ink2);margin-top:6px}
  .tasks{list-style:none;margin:26px 0 0;padding:0}
  .task{margin-bottom:20px}
  .trow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .ttext{font-size:var(--tsize);line-height:1.18;font-weight:500;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--tlines);overflow:hidden;word-break:break-word}
  .tpct{font-family:var(--display);font-weight:700;font-size:calc(var(--tsize) + 2px);color:var(--ink2);flex:none;line-height:1.1}
  .tpct.done{color:var(--mint)}
  .tbar{height:9px;border-radius:5px;background:var(--track);margin-top:9px;overflow:hidden}
  .tbar>span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#4CC9F0,#7C8CFF)}
  .tbar>span.done{background:linear-gradient(90deg,#2FD6A0,#7BF0C8)}
  .none{font-size:26px;color:var(--ink2);margin-top:6px}
  .more{font-size:24px;font-weight:600;color:var(--ink2)}

  /* message */
  .msg{flex:1;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:500;color:var(--ink2);text-align:center}

  /* timeline */
  .timeline{position:absolute;left:72px;right:72px;bottom:40px;height:52px;display:flex;gap:12px}
  .tl{position:relative;height:52px;min-width:0;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);overflow:hidden}
  .tl .fill{position:absolute;left:0;top:0;bottom:0;right:0;background:linear-gradient(90deg,rgba(124,140,255,.55),rgba(76,201,240,.55));transform-origin:left center;transform:scaleX(0)}
  .tl.past .fill{transform:scaleX(1);background:rgba(255,255,255,.10)}
  .tl .lbl{position:absolute;left:20px;right:20px;top:0;bottom:0;display:flex;align-items:center;font-size:24px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl.on{border-color:rgba(255,255,255,.55);box-shadow:0 0 24px rgba(124,140,255,.45)}
  .tl.on .lbl{color:#fff}


  /* live CRM tiles */
  .mrow{display:flex;gap:26px;flex:1;min-height:0;padding-bottom:8px;margin-top:10px}
  .mcol{display:flex;flex-direction:column;gap:26px;min-height:0}
  .cardg{border-radius:28px;padding:26px 34px;min-height:0;position:relative;overflow:hidden;
    background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
    border:1px solid var(--rim);box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 22px 44px rgba(2,6,30,.42)}
  .kpi{--sq:1300px;--fill:linear-gradient(145deg,#161F63,#0A113C);border-radius:28px;padding:28px 38px;flex:1.3;min-height:0;box-shadow:0 26px 60px rgba(2,6,30,.55)}
  .k-label{font-size:30px;font-weight:600;color:#B7C3EA}
  .k-num{display:flex;align-items:baseline;gap:14px;margin-top:10px;font-family:var(--display);font-weight:800;line-height:.9}
  .k-cur{font-size:46px;color:#B7C3EA;font-weight:700}
  .k-amt{display:inline-flex;align-items:baseline}
  .k-dec{font-family:var(--display);font-weight:700;font-size:56px;color:#B7C3EA;margin-left:4px}
  .k-val{font-size:128px;font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#FFFFFF 30%,#B9C4FF 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .k-pill{display:inline-flex;align-items:center;gap:12px;margin-top:16px;padding:8px 22px;border-radius:40px;font-family:var(--display);font-weight:700;font-size:40px;line-height:1.1}
  .k-pill.down{background:rgba(255,107,94,.16);color:var(--coral);border:1px solid rgba(255,107,94,.45)}
  .k-pill.up{background:rgba(47,214,160,.16);color:var(--mint);border:1px solid rgba(47,214,160,.45)}
  .k-sub{font-size:26px;font-weight:500;color:#B7C3EA;margin-top:12px;line-height:1.3}
  .p-title{font-size:28px;font-weight:600;color:var(--ink2)}
  .p-val{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
  .p-note{font-size:26px;font-weight:500;color:var(--ink2);margin-top:10px}
  .p-delta{font-family:var(--display);font-weight:700;font-size:42px}
  .p-delta.down{color:var(--coral)} .p-delta.up{color:var(--mint)}
  .daybar{height:14px;border-radius:7px;background:var(--track);margin-top:16px;overflow:hidden}
  .daybar>span{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#4CC9F0,#7C8CFF)}
  .legend{display:flex;gap:34px;font-size:26px;font-weight:600;color:var(--ink2);margin-bottom:6px}
  .legend i{display:inline-block;width:34px;height:8px;border-radius:4px;margin-right:12px;vertical-align:middle}
  .chart-svg{display:block;width:100%}
  .chart-svg text{font-family:var(--body);fill:#A9B6DB}
  .gauge-card{--sq:1500px;--fill:linear-gradient(145deg,#161F63,#0A113C);border-radius:28px;width:800px;flex:none;display:flex;align-items:center;justify-content:center;
    box-shadow:0 26px 60px rgba(2,6,30,.55)}
  .gauge{position:relative;width:560px;height:560px}
  .gauge svg{position:absolute;left:0;top:0;width:560px;height:560px}
  .g-center{position:absolute;left:0;top:0;width:560px;height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:20px}
  .g-num{font-family:var(--display);font-weight:800;font-size:220px;line-height:.85;font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#FFFFFF 30%,#B9C4FF 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .g-of{font-family:var(--display);font-weight:700;font-size:56px;color:#B7C3EA;margin-top:10px}
  .g-lbl{font-size:28px;font-weight:500;color:#B7C3EA;margin-top:6px}
  .g-pill{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);padding:8px 26px;border-radius:40px;font-family:var(--display);font-weight:700;font-size:42px;
    background:rgba(255,194,75,.16);color:var(--amber);border:1px solid rgba(255,194,75,.45);white-space:nowrap}
  .g-pill.win{background:rgba(47,214,160,.16);color:var(--mint);border-color:rgba(47,214,160,.45)}
  .stat-row{display:flex;gap:26px}
  .stat{flex:1}
  .stat .s-val{font-family:var(--display);font-weight:800;font-size:110px;line-height:.95;font-variant-numeric:tabular-nums}
  .stat .s-lbl{font-size:28px;font-weight:500;color:var(--ink2);margin-top:8px}

  body.idle,body.idle *{cursor:none}
  @media (prefers-reduced-motion: reduce){ .stage,.ring .arc{transition:none} .shine::before{animation:none} }
</style>
</head>
<body>
<div id="canvas">
  <div class="top">
    <div class="brand">
      <div class="mark">R</div>
      <div><div class="brand-name">Raymiyo</div><div class="brand-sub">Sales and team board</div></div>
    </div>
    <div class="clock"><div class="time" id="time"></div><div class="date" id="date"></div></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="timeline" id="timeline"></div>
</div>

<script>
(function(){
  // Used only if the playlist can't be loaded and nothing is cached yet.
  const DEFAULT_TILES = [
    { id:"b2c-sales", type:"chart", title:"B2C Sales — This Month", secs:20, on:true,
      url:"https://crm.zoho.com/crm/specific/ViewChartImage?width=1000&height=500&embedDetails=4f21a008487b89ec72fb7af7053b2b7b947b93e3449bf5626c9b865485db39dce00d3d620382d40c4c3314d75b1d39f1dcae43f9913c2013d943372fccc7e525483c12e804950590b71be62c8884c96d65d30c59cafaf16013a02d28ca70130219129f2f9936d53ebf77ffe87e37652d" },
    { id:"new-b2c-vs-target", type:"chart", title:"New B2C Customers vs Target", secs:20, on:true,
      url:"https://crm.zoho.com/crm/specific/ViewChartImage?width=1000&height=500&embedDetails=121253a543b831b67c1ec55db952fec577b7afae95adc3f4a231444b36830a78ae4c8a5205c58cbc5746a8d4c1aa21e81660843d77f3663f4295fe20febfe3d333bf8ef53edd181a68d033be3417c7534c2a9030dcab160f2c6992b82d2f575b6f663ad18fbffd27842743c7de3e4d9d" },
    { id:"huddle-tasks", type:"tasks", title:"This week's huddle", secs:30, on:true }
  ];

  const WHO   = { sajina:"#7C5CE6", divash:"#1BA7E0", manoj:"#F59A23", krisha:"#E8508F", sunil:"#1EB980" };
  const ROLES = { sajina:"CRM and B2B", divash:"Operations", manoj:"Accounts", krisha:"Content", sunil:"Warehouse" };
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  const $ = id => document.getElementById(id);
  const stage = $("stage"), timeline = $("timeline"), canvas = $("canvas");
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  function h(tag, cls, text){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text !== undefined) e.textContent = text;
    return e;
  }
  function svg(tag, attrs){
    const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  if(location.search.indexOf("lite") > -1) document.body.classList.add("lite");   // add ?lite to the URL to stop the border animation

  // ── scale the 1920×1080 canvas to any screen ──
  // TV browsers sometimes report 0 or a wrong size at first, so: measure three ways, take the smallest
  // that makes sense, keep the board hidden until a real size is known, and re-check every few seconds.
  function measure(){
    const vv = window.visualViewport, de = document.documentElement;
    const sets = [
      [window.innerWidth, window.innerHeight],
      [de ? de.clientWidth : 0, de ? de.clientHeight : 0],
      [vv ? vv.width : 0, vv ? vv.height : 0]
    ].filter(d => d[0] > 100 && d[1] > 100);
    if(!sets.length) return null;
    return { w: Math.min.apply(null, sets.map(d => d[0])), h: Math.min.apply(null, sets.map(d => d[1])), sets };
  }
  let lastScale = 0;
  function fit(){
    const m = measure();
    if(!m) return false;
    const s = Math.min(m.w / 1920, m.h / 1080);
    if(Math.abs(s - lastScale) > 0.001){
      lastScale = s;
      canvas.style.transform = "translate(-50%,-50%) scale(" + s + ")";
    }
    canvas.classList.add("ready");
    if(dbgEl){
      dbgEl.textContent = "inner  " + window.innerWidth + " x " + window.innerHeight +
        "\nclient " + document.documentElement.clientWidth + " x " + document.documentElement.clientHeight +
        "\nvisual " + (window.visualViewport ? Math.round(window.visualViewport.width) + " x " + Math.round(window.visualViewport.height) + " (x" + window.visualViewport.scale + ")" : "n/a") +
        "\nscreen " + (window.screen ? screen.width + " x " + screen.height : "n/a") + "   dpr " + window.devicePixelRatio +
        "\nusing  " + Math.round(m.w) + " x " + Math.round(m.h) + "   scale " + s.toFixed(3);
    }
    return true;
  }
  let dbgEl = null;
  if(location.search.indexOf("debug") > -1){ dbgEl = document.createElement("div"); dbgEl.id = "dbg"; document.body.appendChild(dbgEl); }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);
  window.addEventListener("load", fit);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", fit);
  fit();
  let tries = 0;
  (function recheck(){
    fit(); tries++;
    setTimeout(recheck, tries < 40 ? 250 : 5000);   // quick retries at start, then every 5 s
  })();

  // ── clock (Nepal time) ──
  function nowParts(){
    try{
      const t = new Intl.DateTimeFormat("en-GB", { timeZone:"Asia/Kathmandu", hour:"numeric", minute:"2-digit", hour12:true }).format(new Date());
      const d = new Date(new Date().toLocaleString("en-US", { timeZone:"Asia/Kathmandu" }));
      return { time:t.replace(/\s?([ap]m)/i, " $1").toLowerCase(), date: DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()] };
    }catch(e){
      const d = new Date();
      return { time: d.toLocaleTimeString([], { hour:"numeric", minute:"2-digit" }), date: DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()] };
    }
  }
  function tick(){ const p = nowParts(); $("time").textContent = p.time; $("date").textContent = p.date; }
  tick(); setInterval(tick, 15000);

  // ── data ──
  async function fetchTiles(){
    try{
      const r = await fetch("/api/tiles", { cache:"no-store" });
      if(!r.ok) throw new Error("bad status");
      const d = await r.json();
      if(Array.isArray(d.tiles)){
        try{ localStorage.setItem("tvTiles", JSON.stringify(d.tiles)); }catch(e){}
        return d.tiles;
      }
    }catch(e){}
    try{
      const c = JSON.parse(localStorage.getItem("tvTiles") || "null");
      if(Array.isArray(c)) return c;
    }catch(e){}
    return DEFAULT_TILES;
  }
  async function fetchTasks(){
    try{
      const r = await fetch("/api/tasks", { cache:"no-store" });
      if(!r.ok) return null;
      const d = await r.json();
      return d && Array.isArray(d.members) ? d : null;
    }catch(e){ return null; }
  }

  // ── helpers ──
  function status(p){
    if(p >= 80) return { c:"#2FD6A0", t:"Excellent" };
    if(p >= 50) return { c:"#FFC24B", t:"On track" };
    return { c:"#FF6B5E", t:"Needs focus" };
  }
  function rgba(hex, a){
    const n = parseInt(hex.slice(1), 16);
    return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }
  function weekText(key){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key || "");
    if(!m) return "";
    const a = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    const b = new Date(a.getTime() + 6 * 86400000);
    return MONTHS[a.getUTCMonth()] + " " + a.getUTCDate() + " – " + MONTHS[b.getUTCMonth()] + " " + b.getUTCDate();
  }
  function countUp(el, to, plain){
    const fmt = v => plain === true ? String(v) : plain === false ? inr(v, false) : v + "%";
    if(reduceMotion || to <= 0){ el.textContent = fmt(to); return; }
    const steps = 24;
    el.textContent = fmt(0);
    for(let i = 1; i <= steps; i++){
      setTimeout(() => { el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - i / steps, 3)))); }, i * 45);
    }
  }

  // Task text shrinks step by step until every column fits; as a last resort the
  // extra tasks are folded into "+N more".
  const LEVELS = [[30,3],[27,3],[25,2],[23,2],[21,2],[20,1]];
  function fitSheet(sheet){
    const cols = Array.prototype.slice.call(sheet.children);
    const over = c => c.scrollHeight > c.clientHeight + 1;
    for(let i = 0; i < LEVELS.length; i++){
      sheet.style.setProperty("--tsize", LEVELS[i][0] + "px");
      sheet.style.setProperty("--tlines", LEVELS[i][1]);
      if(!cols.some(over)) return;
    }
    cols.forEach(c => {
      const ul = c.querySelector(".tasks");
      if(!ul) return;
      let hidden = 0, more = null;
      while(over(c)){
        const items = ul.querySelectorAll(".task");
        if(items.length <= 1) break;
        ul.removeChild(items[items.length - 1]); hidden++;
        if(!more){ more = h("li", "more"); ul.appendChild(more); }
        more.textContent = "+" + hidden + " more";
      }
    });
  }

  // ── number formatting in the Nepali/Indian style the CRM dashboard uses (3,17,879.75) ──
  function inr(n, dec){
    const neg = n < 0; n = Math.abs(Number(n) || 0);
    const parts = (dec ? n.toFixed(2) : String(Math.round(n))).split(".");
    let i = parts[0], f = parts[1];
    let last3 = i.slice(-3), rest = i.slice(0, -3);
    if(rest) last3 = "," + last3;
    rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ",");
    return (neg ? "-" : "") + rest + last3 + (f ? "." + f : "");
  }
  function shortMoney(n){
    if(n >= 100000){ const v = n / 100000; return (v % 1 ? v.toFixed(1) : String(v)) + "L"; }
    if(n >= 1000){ const v = n / 1000; return (v % 1 ? v.toFixed(1) : String(v)) + "K"; }
    return String(n);
  }
  // round-number axis: e.g. 3,17,880 becomes 0, 1L, 2L, 3L, 4L
  function niceScale(max){
    if(!(max > 0)) return { top:1000, step:250 };
    const raw = max / 4, p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), f = raw / p;
    const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
    return { top: Math.ceil(max / step) * step, step };
  }
  function timeText(iso){
    try{
      const t = new Intl.DateTimeFormat("en-GB", { timeZone:"Asia/Kathmandu", hour:"numeric", minute:"2-digit", hour12:true }).format(new Date(iso));
      return t.replace(/\s?([ap]m)/i, " $1").toLowerCase();
    }catch(e){ return ""; }
  }

  function lineChart(sales){
    const W = 1080, H = 560, L = 96, R = 30, T = 24, B = 62;
    const iw = W - L - R, ih = H - T - B;
    const days = Math.max(sales.daysInMonth, sales.daysInPrevMonth);
    const sc = niceScale(Math.max(sales.prevTotal, sales.total, 1));
    const top = sc.top;
    const x = d => L + (days === 1 ? 0 : (d - 1) / (days - 1) * iw);
    const y = v => T + ih - (v / top) * ih;
    const svgEl = svg("svg", { "class":"chart-svg", viewBox:"0 0 " + W + " " + H });
    const defs = svg("defs", {});
    const g1 = svg("linearGradient", { id:"gCur", x1:"0", y1:"0", x2:"1", y2:"0" });
    g1.appendChild(svg("stop", { offset:"0", "stop-color":"#4CC9F0" })); g1.appendChild(svg("stop", { offset:"1", "stop-color":"#2FD6A0" }));
    const g2 = svg("linearGradient", { id:"gArea", x1:"0", y1:"0", x2:"0", y2:"1" });
    g2.appendChild(svg("stop", { offset:"0", "stop-color":"#4CC9F0", "stop-opacity":".38" })); g2.appendChild(svg("stop", { offset:"1", "stop-color":"#4CC9F0", "stop-opacity":"0" }));
    defs.appendChild(g1); defs.appendChild(g2); svgEl.appendChild(defs);

    // grid + y labels
    const ticks = Math.round(top / sc.step);
    for(let i = 0; i <= ticks; i++){
      const v = sc.step * i, yy = y(v);
      svgEl.appendChild(svg("line", { x1:L, x2:W - R, y1:yy, y2:yy, stroke:"rgba(255,255,255,.12)", "stroke-width":2 }));
      const t = svg("text", { x:L - 16, y:yy + 10, "text-anchor":"end", "font-size":26 }); t.textContent = shortMoney(v); svgEl.appendChild(t);
    }
    // x labels
    [1, 5, 10, 15, 20, 25, 30].forEach(d => {
      if(d > days) return;
      const t = svg("text", { x:x(d), y:H - 18, "text-anchor":"middle", "font-size":26 }); t.textContent = String(d); svgEl.appendChild(t);
    });

    function pathOf(arr){
      let dstr = "", started = false;
      arr.forEach((v, i) => { if(v === null || v === undefined) return; dstr += (started ? " L" : "M") + x(i + 1).toFixed(1) + " " + y(v).toFixed(1); started = true; });
      return dstr;
    }
    // last month (soft)
    svgEl.appendChild(svg("path", { d:pathOf(sales.prevCum), fill:"none", stroke:"#7C8CFF", "stroke-opacity":".6", "stroke-width":6, "stroke-linecap":"round", "stroke-linejoin":"round" }));
    // this month: area + line
    const cur = sales.cum.filter(v => v !== null && v !== undefined);
    const lastDay = cur.length;
    if(lastDay > 0){
      const line = pathOf(sales.cum);
      svgEl.appendChild(svg("path", { d: line + " L" + x(lastDay).toFixed(1) + " " + y(0).toFixed(1) + " L" + x(1).toFixed(1) + " " + y(0).toFixed(1) + " Z", fill:"url(#gArea)", stroke:"none" }));
      const p = svg("path", { d:line, fill:"none", stroke:"url(#gCur)", "stroke-width":9, "stroke-linecap":"round", "stroke-linejoin":"round" });
      svgEl.appendChild(p);
      try{ const len = p.getTotalLength(); if(len && !reduceMotion){ p.setAttribute("stroke-dasharray", len); p.setAttribute("stroke-dashoffset", len); p.style.transition = "stroke-dashoffset 1.4s ease-out"; setTimeout(() => p.setAttribute("stroke-dashoffset", 0), 80); } }catch(e){}
      const ex = x(lastDay), ey = y(cur[lastDay - 1]);
      svgEl.appendChild(svg("circle", { cx:ex, cy:ey, r:20, fill:"#4CC9F0", "fill-opacity":".28" }));
      svgEl.appendChild(svg("circle", { cx:ex, cy:ey, r:11, fill:"#FFFFFF" }));

  function gaugeSvg(c){
    const S = 560, cx = 280, cy = 280, r = 214, sw = 44, span = 240;
    const C = 2 * Math.PI * r;
    const pct = Math.max(0, Math.min(1, c.target ? c.count / c.target : 0));
    const e = svg("svg", { viewBox:"0 0 " + S + " " + S });
    const defs = svg("defs", {});
    const g = svg("linearGradient", { id:"gG", x1:"0", y1:"1", x2:"1", y2:"0" });
    g.appendChild(svg("stop", { offset:"0", "stop-color":"#7C5CFF" })); g.appendChild(svg("stop", { offset:"1", "stop-color":"#4CC9F0" }));
    defs.appendChild(g); e.appendChild(defs);
    const rot = "rotate(150 " + cx + " " + cy + ")";
    e.appendChild(svg("circle", { cx, cy, r, fill:"none", stroke:"rgba(255,255,255,.12)", "stroke-width":sw, "stroke-linecap":"round",
      "stroke-dasharray":(span / 360 * C).toFixed(1) + " " + C.toFixed(1), transform:rot }));
    const prog = svg("circle", { cx, cy, r, fill:"none", stroke:"url(#gG)", "stroke-width":sw, "stroke-linecap":"round",
      "stroke-dasharray":"0 " + C.toFixed(1), transform:rot });
    prog.style.transition = reduceMotion ? "none" : "stroke-dasharray 1.4s ease-out";
    e.appendChild(prog);
    const len = (pct * span / 360 * C);
    setTimeout(() => prog.setAttribute("stroke-dasharray", Math.max(0.1, len).toFixed(1) + " " + C.toFixed(1)), 80);
    // end marker
    const ang = (150 + span * pct) * Math.PI / 180;
    e.appendChild(svg("circle", { cx:(cx + r * Math.cos(ang)).toFixed(1), cy:(cy + r * Math.sin(ang)).toFixed(1), r:14, fill:"#FFFFFF" }));
    return e;

  function runProgress(index, secs){
    tlItems.forEach((x, k) => {
      x.it.classList.toggle("on", k === index);
      x.it.classList.toggle("past", k < index);
      if(k !== index){ x.fill.style.transition = "none"; x.fill.style.transform = ""; }
    });
    const f = tlItems[index].fill;
    f.style.transition = "none";
    f.style.transform = "scaleX(0)";
    void f.offsetWidth;                                   // restart the animation
    f.style.transition = "transform " + secs + "s linear";
    f.style.transform = "scaleX(1)";
  }

      const playlist = tiles.filter(t =>
        t.type === "tasks" ? hasTasks :
        t.type === "metric" ? !!(metrics && metrics[t.metric]) : true);

      if(!playlist.length){
        const crmDown = wantsMetrics && !(metrics && (metrics.sales || metrics.customers));
        showMessage(crmDown ? "Live CRM numbers are not loading right now. Retrying\u2026"
                            : "Nothing to show yet. Add a tile in /admin.");
        await sleep(crmDown ? 15000 : 30000);
        continue;
      }

      buildTimeline(playlist);
      for(let i = 0; i < playlist.length; i++){
        const t = playlist[i];
        const secs = Number(t.secs) || 20;
        if(t.type === "tasks") await swapTo(() => renderTasks(tasks, t), i, secs);
        else if(t.type === "metric") await swapTo(() => renderMetric(t, metrics), i, secs);
        else await swapTo(() => renderChart(t), i, secs);
        await sleep(secs * 1000);
      }
    }
  }

  // ── full screen: press F or double-click (browsers only allow it after a click or key) ──
  function toggleFull(){
    const d = document, el = d.documentElement;
    const on = d.fullscreenElement || d.webkitFullscreenElement;
    try{
      if(on){ (d.exitFullscreen || d.webkitExitFullscreen || function(){}).call(d); }
      else { (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el); }
    }catch(e){}
  }
  document.addEventListener("keydown", e => { if(e.key === "f" || e.key === "F") toggleFull(); });
  document.addEventListener("dblclick", toggleFull);

  // hide the mouse pointer after 3 seconds of no movement
  let idleTimer = null;
  function wake(){ document.body.classList.remove("idle"); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000); }
  document.addEventListener("mousemove", wake); wake();

  main();
  setTimeout(() => location.reload(), 6 * 60 * 60 * 1000); // fresh start every 6 hours
})();
</script>
</body>
</html>
